name: Build Kernel - SukiSU (apollo / Lunaris AOSP Android 16)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "aoitsme/android_kernel_sony_sdm845 のブランチ (ROMが使っているもの)"
        required: false
        default: "lineage-23.0"
        type: string
      sukisu_ref:
        description: "SukiSU-Ultra のコミット/タグ (builtin ブランチ上のコミットを固定)"
        required: false
        default: "b1d534bc41941b2c818d7a1a1dac341e4aabfc2d"
        type: string
      enable_feature_kpm:
        description: "KPMを有効にする"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache_apollo
      CCACHE_MAXSIZE: 8G
      DEFCONFIG: tama_apollo_kddi_defconfig   # 参考元の xz2c_dcm と同じ構成
    name: Build Kernel for apollo
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Package
        run: sudo apt update && sudo apt install -y p7zip-full git ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache_apollo
          key: ccache-${{ runner.os }}-${{ github.ref }}-apollo
          restore-keys: |
            ccache-${{ runner.os }}-apollo-
            ccache-${{ runner.os }}-

      - uses: actions/checkout@v5

      - name: Get Kernel Source Code
        uses: actions/checkout@v5
        with:
          repository: aoitsme/android_kernel_sony_sdm845
          ref: ${{ inputs.kernel_branch }}
          path: kernel

      - name: Setup Cross-compile toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-22/llvm22.0.0-binutils2.44_amd64-kernel-arm_static-20250831.7z
          7za x llvm22.0.0-binutils2.44_amd64-kernel-arm_static-20250831.7z
          rm llvm22.0.0-binutils2.44_amd64-kernel-arm_static-20250831.7z

      - name: Set up SukiSU
        working-directory: kernel
        run: |
          echo DATE=$(date +%F) >> $GITHUB_ENV
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ inputs.sukisu_ref }}"
          cd ./KernelSU
          # 指定refにちゃんとチェックアウトできたか確認 (失敗時は黙ってmainになるため)
          test "$(git rev-parse HEAD)" = "$(git rev-parse '${{ inputs.sukisu_ref }}^{commit}')" || { echo "SukiSU ref checkout failed"; exit 1; }
          echo "KSUVER=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV

      - name: Get SukiSU Patches
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Ultra/SukiSU_patch
          path: sukisu_patch

      - name: Get susfs4ksu
        run: |
          git clone -b kernel-4.9 --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* $GITHUB_WORKSPACE/kernel/fs/
          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* $GITHUB_WORKSPACE/kernel/include/linux/

      - name: Patch Kernel
        working-directory: kernel
        run: |
          patch -p1 < $GITHUB_WORKSPACE/Patches/fix-build-error.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/ksu-syscall-hooks.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/apply-susfs.patch

      - name: Add Kernel Build Configuration Settings
        working-directory: kernel/arch/arm64/configs
        run: |
          C=./${DEFCONFIG}
          echo "CONFIG_KSU=y" >> $C

          # SUSFS (固定したSukiSUのKconfigに存在する項目のみ)
          echo "CONFIG_KSU_SUSFS=y" >> $C
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $C
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $C
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $C
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $C
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $C
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $C
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $C
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $C
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $C

          # BBR
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> $C
          echo "CONFIG_TCP_CONG_BBR=y" >> $C
          echo "CONFIG_NET_SCH_FQ=y" >> $C
          echo "CONFIG_TCP_CONG_BIC=n" >> $C
          echo "CONFIG_TCP_CONG_CUBIC=n" >> $C
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> $C
          echo "CONFIG_TCP_CONG_HTCP=n" >> $C
          echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> $C

          if [ "${{ inputs.enable_feature_kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> $C
          fi

      - name: Build Kernel for apollo
        working-directory: kernel
        env:
          args: |+
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang LD=ld.lld
            HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3
        run: |
          export KBUILD_BUILD_TIMESTAMP=$(date)
          export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/toolchain/bin:$PATH
          make -j$(nproc --all) ${args} ${DEFCONFIG} all

      - name: Apply KernelPatch for KPM
        if: ${{ inputs.enable_feature_kpm }}
        working-directory: kernel/out/arch/arm64/boot
        run: |
          cp $GITHUB_WORKSPACE/sukisu_patch/kpm/patch_linux .
          chmod +x patch_linux
          ./patch_linux
          mv oImage Image

      - name: Make AnyKernel3
        run: |
          ls $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/AnyKernel3

      - name: Pack kernel image with AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: apollo_SukiSU_${{ env.KSUVER }}
          path: AnyKernel3
          compression-level: 9
